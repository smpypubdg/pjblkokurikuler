    const compressImage = (file, maxWidth = 800, quality = 0.7) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve({ url: dataUrl, name: file.name });
          };
          img.onerror = () => {
            resolve({ url: event.target.result, name: file.name });
          };
        };
      });
    };

    function AttendanceCharts({ allData, filterGroup, filterDate }) {
      const pieChartRef = useRef(null);
      const genderChartRef = useRef(null);
      const lineChartRef = useRef(null);
      const classChartRef = useRef(null);

      const chartInstances = useRef({});

      useEffect(() => {
        if (typeof window.Chart === 'undefined') return;

        Object.keys(chartInstances.current).forEach(key => {
          if (chartInstances.current[key]) {
            chartInstances.current[key].destroy();
          }
        });

        const filteredGroups = allData.filter(d => filterGroup === 'ALL' || d.group.id === filterGroup);

        let totalHadir = 0, totalSakit = 0, totalIzin = 0, totalAlfa = 0, totalDispensasi = 0;
        let totalLakiHadir = 0, totalPerempuanHadir = 0;

        const classStats = { 'VII-A': 0, 'VII-B': 0, 'VIII-A': 0, 'IX-A': 0, 'IX-B': 0 };
        const dateMap = {};

        filteredGroups.forEach(d => {
          d.presensiList.forEach(p => {
            if (filterDate && p.date !== filterDate) return;

            if (!dateMap[p.date]) dateMap[p.date] = { L: 0, P: 0, Total: 0 };

            if (p.records) {
              p.records.forEach(r => {
                const member = d.members.find(m => m.id === r.studentId) || { jk: 'L', kelas: 'VII-A' };

                if (r.status === 'Hadir') {
                  totalHadir++;
                  dateMap[p.date].Total++;

                  if (member.jk === 'L') {
                    totalLakiHadir++;
                    dateMap[p.date].L++;
                  } else {
                    totalPerempuanHadir++;
                    dateMap[p.date].P++;
                  }

                  if (classStats[member.kelas] !== undefined) {
                    classStats[member.kelas]++;
                  }
                } else if (r.status === 'Sakit') totalSakit++;
                else if (r.status === 'Izin') totalIzin++;
                else if (r.status === 'Alfa') totalAlfa++;
                else if (r.status === 'Dispensasi') totalDispensasi++;
              });
            }
          });
        });

        if (pieChartRef.current) {
          chartInstances.current.pie = new window.Chart(pieChartRef.current, {
            type: 'pie',
            data: {
              labels: ['Hadir', 'Sakit', 'Izin', 'Alfa', 'Dispensasi'],
              datasets: [{
                data: [totalHadir, totalSakit, totalIzin, totalAlfa, totalDispensasi],
                backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#ef4444', '#a855f7']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } },
                title: { display: true, text: 'Proporsi Status Kehadiran', font: { size: 11, weight: 'bold' } }
              }
            }
          });
        }

        if (genderChartRef.current) {
          chartInstances.current.gender = new window.Chart(genderChartRef.current, {
            type: 'doughnut',
            data: {
              labels: ['Laki-laki (Hadir)', 'Perempuan (Hadir)'],
              datasets: [{
                data: [totalLakiHadir, totalPerempuanHadir],
                backgroundColor: ['#0284c7', '#ec4899']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } },
                title: { display: true, text: 'Kehadiran Berdasarkan Gender', font: { size: 11, weight: 'bold' } }
              }
            }
          });
        }

        const sortedDates = Object.keys(dateMap).sort();
        const lakiTrend = sortedDates.map(d => dateMap[d].L);
        const perempuanTrend = sortedDates.map(d => dateMap[d].P);

        if (lineChartRef.current) {
          chartInstances.current.line = new window.Chart(lineChartRef.current, {
            type: 'line',
            data: {
              labels: sortedDates.length > 0 ? sortedDates : ['Belum Ada Data'],
              datasets: [
                {
                  label: 'Siswa Laki-laki',
                  data: lakiTrend.length > 0 ? lakiTrend : [0],
                  borderColor: '#0284c7',
                  backgroundColor: 'rgba(2, 132, 199, 0.1)',
                  tension: 0.3,
                  fill: true
                },
                {
                  label: 'Siswa Perempuan',
                  data: perempuanTrend.length > 0 ? perempuanTrend : [0],
                  borderColor: '#ec4899',
                  backgroundColor: 'rgba(236, 72, 153, 0.1)',
                  tension: 0.3,
                  fill: true
                }
              ]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'top', labels: { boxWidth: 10, font: { size: 10 } } },
                title: { display: true, text: 'Tren Kehadiran Harian (L vs P)', font: { size: 11, weight: 'bold' } }
              },
              scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
              }
            }
          });
        }

        if (classChartRef.current) {
          const classNames = Object.keys(classStats);
          const classData = classNames.map(c => classStats[c]);

          chartInstances.current.classBar = new window.Chart(classChartRef.current, {
            type: 'bar',
            data: {
              labels: classNames,
              datasets: [{
                label: 'Jumlah Kehadiran Siswa',
                data: classData,
                backgroundColor: ['#6366f1', '#14b8a6', '#f59e0b', '#8b5cf6', '#3b82f6']
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                title: { display: true, text: 'Distribusi Kehadiran per Kelas', font: { size: 11, weight: 'bold' } }
              },
              scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
              }
            }
          });
        }

      }, [allData, filterGroup, filterDate]);

      return (
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
          <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 h-56 shadow-xs flex flex-col items-center justify-center">
            <canvas ref={pieChartRef}></canvas>
          </div>
          <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 h-56 shadow-xs flex flex-col items-center justify-center">
            <canvas ref={genderChartRef}></canvas>
          </div>
          <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 h-56 shadow-xs flex flex-col items-center justify-center">
            <canvas ref={lineChartRef}></canvas>
          </div>
          <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200 h-56 shadow-xs flex flex-col items-center justify-center">
            <canvas ref={classChartRef}></canvas>
          </div>
        </div>
      );
    }

          try {
            const colRef = fb.collection(fb.db, 'artifacts', fb.appId, 'public', 'data', 'group_data');
            const unsubscribe = fb.onSnapshot(colRef, (snapshot) => {
              const map = {};
              snapshot.forEach(docSnap => {
                map[docSnap.id] = docSnap.data();
              });
              setCloudDataMap(map);
            }, (error) => {
              console.warn("Admin listener notice:", error);
            });
            return () => unsubscribe();
          } catch(e) {
            console.warn(e);
          }
        }
      }, []);

      const allData = useMemo(() => {
        return DEFAULT_GROUPS.map(g => {
          const gKey = `pjbl_data_${g.id}`;
          const savedLocal = localStorage.getItem(gKey);
          const initialMems = getInitialMembersForGroup(g.rawGroup);
          
          let members = initialMems;
          let presensiList = [
            {
              id: 'p-1',
              date: new Date().toISOString().split('T')[0],
              records: initialMems.map(m => ({ studentId: m.id, name: m.name, status: '', note: '' }))
            }
          ];
          let lkpdList = [];
          let jurnalList = [];

          if (cloudDataMap[g.id]) {
            const cData = cloudDataMap[g.id];
            if (cData.members && cData.members.length > 0) members = cData.members;
            if (cData.presensiList) presensiList = cData.presensiList;
            if (cData.lkpdList) lkpdList = cData.lkpdList;
            if (cData.jurnalList) jurnalList = cData.jurnalList;
          } else if (savedLocal) {
            try {
              const parsed = JSON.parse(savedLocal);
              if (parsed.members && parsed.members.length > 0) members = parsed.members;
              if (parsed.presensiList) presensiList = parsed.presensiList;
              if (parsed.lkpdList) lkpdList = parsed.lkpdList;
              if (parsed.jurnalList) jurnalList = parsed.jurnalList;
            } catch (err) {
              console.error("Failed parsing data for group", g.id, err);
            }
          }

          return {
            group: g,
            members,
            presensiList,
            lkpdList,
            jurnalList

    function LKPDTab({ activeTheme, currentGroup, lkpdList, setLkpdList, saveDataToLocalStorage, showToast }) {
      const [pemateri, setPemateri] = useState('');
      const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
      const [lkpdNo, setLkpdNo] = useState(lkpdList.length + 1);
      const [title, setTitle] = useState('');
      const [notes, setNotes] = useState('');

      const [docFiles, setDocFiles] = useState([]);
      const [workFiles, setWorkFiles] = useState([]);
      const [isProcessing, setIsProcessing] = useState(false);

      const [previewModal, setPreviewModal] = useState(null);

      const handleDocFilesChange = async (e) => {
        const selected = Array.from(e.target.files);
        if (!selected.length) return;

        setIsProcessing(true);
        for (const file of selected) {
          const comp = await compressImage(file);
          setDocFiles((prev) => [...prev, comp]);
        }
        setIsProcessing(false);
      };

      const handleWorkFilesChange = async (e) => {
        const selected = Array.from(e.target.files);
        if (!selected.length) return;

        setIsProcessing(true);
        for (const file of selected) {
          const comp = await compressImage(file);
          setWorkFiles((prev) => [...prev, comp]);
        }
        setIsProcessing(false);
      };

      const handleRemoveDocFile = (idx) => {
        setDocFiles((prev) => prev.filter((_, i) => i !== idx));
      };

      const handleRemoveWorkFile = (idx) => {
        setWorkFiles((prev) => prev.filter((_, i) => i !== idx));
      };

      const handleSubmitLkpd = (e) => {
        e.preventDefault();
        if (!title.trim() || !pemateri.trim()) return;

        if (docFiles.length === 0 && workFiles.length === 0) {
          showToast('Harap unggah minimal 1 file di salah satu kategori dokumentasi/LKPD', 'error');
          return;
        }

        const newEntry = {
          id: `lkpd-${Date.now()}`,
          no: parseInt(lkpdNo, 10) || lkpdList.length + 1,
          title: title.trim(),
          pemateri: pemateri.trim(),
          date,
          docFiles,
          workFiles,
          status: 'Terverifikasi',
          notes: notes.trim() || 'Sudah dilengkapi.'
        };

        const updated = [newEntry, ...lkpdList];
        setLkpdList(updated);
        saveDataToLocalStorage({ lkpdList: updated });

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [currentGroup, setCurrentGroup] = useState(DEFAULT_GROUPS[0]);
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userRole, setUserRole] = useState(null);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      
      const [loginRole, setLoginRole] = useState('group');
      const [usernameInput, setUsernameInput] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [captchaCode, setCaptchaCode] = useState('');
      const [captchaInput, setCaptchaInput] = useState('');
      const [passcodeError, setPasscodeError] = useState('');

      const [members, setMembers] = useState([]);
      const [presensiList, setPresensiList] = useState([]);
      const [lkpdList, setLkpdList] = useState([]);
      const [jurnalList, setJurnalList] = useState([]);
      const [isStructureLocked, setIsStructureLocked] = useState(false);

      const [cloudStatus, setCloudStatus] = useState('connected');
      const [toast, setToast] = useState({ show: false, message: '', type: 'success' });

      const activeTheme = useMemo(() => {
        return getGroupTheme(currentGroup.rawGroup);
      }, [currentGroup]);

      const generateCaptcha = () => {
        const digits = '0123456789';
        let result = '';
        for (let i = 0; i < 5; i++) {
          result += digits.charAt(Math.floor(Math.random() * digits.length));
        }
        setCaptchaCode(result);
        setCaptchaInput('');
      };

      useEffect(() => {
        generateCaptcha();
      }, [loginRole]);

      const groupUserPassMap = useMemo(() => {
        const map = {};
        DEFAULT_GROUPS.forEach(g => {
          const cred = g.rawGroup.toLowerCase().replace(/\s+/g, '_');
          map[cred] = {
            password: cred,
            group: g
          };
          if (cred.startsWith('dirandra_')) {
            const alias = cred.replace('dirandra_', 'dinandra_');
            map[alias] = { password: alias, group: g };
          }
        });
        return map;
      }, []);

      useEffect(() => {
        if (!currentGroup) return;

        const initialMems = getInitialMembersForGroup(currentGroup.rawGroup);
        const initialPres = [
          {
            id: 'p-1',
            date: new Date().toISOString().split('T')[0],
            records: initialMems.map(m => ({ studentId: m.id, name: m.name, status: '', note: '' }))
          }
        ];

        const gKey = `pjbl_data_${currentGroup.id}`;
        const savedLocal = localStorage.getItem(gKey);
        if (savedLocal) {
          try {
            const parsed = JSON.parse(savedLocal);
            setMembers(parsed.members && parsed.members.length > 0 ? parsed.members : initialMems);
            setPresensiList(parsed.presensiList || initialPres);
            setLkpdList(parsed.lkpdList || []);
            setJurnalList(parsed.jurnalList || []);
            setIsStructureLocked(parsed.isStructureLocked || false);
          } catch(e) {
            console.error(e);
          }
        } else {
          setMembers(initialMems);
          setPresensiList(initialPres);
          setLkpdList([]);
          setJurnalList([]);
          setIsStructureLocked(false);
        }

        const fb = window.FirebaseApp;
        if (fb && fb.isReady && fb.db && fb.user) {
          try {
            const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'group_data', currentGroup.id);
            const unsubscribe = fb.onSnapshot(docRef, (docSnap) => {
              if (docSnap.exists()) {
                const data = docSnap.data();
                setMembers(data.members || initialMems);
                setPresensiList(data.presensiList || initialPres);
                setLkpdList(data.lkpdList || []);
                setJurnalList(data.jurnalList || []);
                setIsStructureLocked(data.isStructureLocked || false);
                localStorage.setItem(gKey, JSON.stringify(data));
                setCloudStatus('connected');
              }
            }, (error) => {
              console.warn("Real-time cloud listener notice:", error);
              setCloudStatus('offline');
            });

            return () => unsubscribe();
          } catch (err) {
            console.warn("Cloud setup notice:", err);
          }
        }
      }, [currentGroup.id, currentGroup.rawGroup]);

      const saveDataToLocalStorage = async (updatedData) => {
        setCloudStatus('syncing');
        const gKey = `pjbl_data_${currentGroup.id}`;
        const currentPayload = {
          members,
          presensiList,
          lkpdList,
          jurnalList,
          isStructureLocked,
          ...updatedData
        };

        localStorage.setItem(gKey, JSON.stringify(currentPayload));

        const fb = window.FirebaseApp;
        if (fb && fb.isReady && fb.db && fb.user) {
          try {
            const docRef = fb.doc(fb.db, 'artifacts', fb.appId, 'public', 'data', 'group_data', currentGroup.id);
            await fb.setDoc(docRef, {
              ...currentPayload,
              updatedAt: Date.now()
            }, { merge: true });
            setCloudStatus('connected');
          } catch (err) {
            console.warn("Cloud sync save error:", err);
            setCloudStatus('offline');
          }
        } else {
          setCloudStatus('connected');
        }
      };

      const showToast = (message, type = 'success') => {
        setToast({ show: true, message, type });
        setTimeout(() => {
          setToast({ show: false, message: '', type: 'success' });
        }, 3500);
      };

      const handleLogout = () => {
        setIsLoggedIn(false);
        setUserRole(null);
        setUsernameInput('');
        setPasswordInput('');
        generateCaptcha();
        showToast('Anda telah keluar dari sesi portal', 'info');
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();

        if (captchaInput.trim() !== captchaCode) {
          setPasscodeError('Kode Captcha angka tidak sesuai. Silakan coba lagi.');
          generateCaptcha();
          return;
        }

        const userClean = usernameInput.trim().toLowerCase();
        const passClean = passwordInput.trim();

        if (loginRole === 'admin') {
          if (userClean === 'administrator' && passClean === 'leadershipcamp') {
            setUserRole('admin');
            setIsLoggedIn(true);
            setPasscodeError('');
            setUsernameInput('');
            setPasswordInput('');
            showToast('Berhasil masuk sebagai Administrator Portal!');
          } else {
            setPasscodeError('Username atau Password Administrator tidak valid.');
            generateCaptcha();
          }
        } else {
          const match = groupUserPassMap[userClean];
          if (match && match.password === passClean) {
            setCurrentGroup(match.group);
            setUserRole('group');
            setIsLoggedIn(true);
            setActiveTab('home');
            setPasscodeError('');
            setUsernameInput('');
            setPasswordInput('');
            showToast(`Berhasil masuk sebagai ${match.group.name}`);
          } else {
            setPasscodeError('Username atau Password kelompok tidak cocok.');
            generateCaptcha();
          }
        }
      };

      return (
        <div className={`min-h-screen ${isLoggedIn && userRole === 'group' ? activeTheme.bodyBg : 'bg-slate-50'} text-slate-800 font-sans flex flex-col relative transition-colors duration-300`}>
          
          {toast.show && (
            <div className={`fixed top-5 right-5 z-50 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl border backdrop-blur-md transition-all transform animate-bounce ${
              toast.type === 'error' 
                ? 'bg-rose-50/95 border-rose-200 text-rose-800' 
                : toast.type === 'info'
                ? 'bg-amber-50/95 border-amber-200 text-amber-800'
                : 'bg-emerald-50/95 border-emerald-300 text-emerald-900'
            }`}>
              {toast.type === 'error' ? <AlertCircle className="w-5 h-5 text-rose-600" /> : <CheckCircle2 className="w-5 h-5 text-emerald-600" />}
              <span className="text-sm font-semibold">{toast.message}</span>
            </div>
          )}

          {!isLoggedIn ? (
            <div className="flex-1 flex items-center justify-center p-4 relative z-10 bg-slate-950 overflow-hidden min-h-screen">
              <div className="absolute inset-0 pointer-events-none overflow-hidden select-none">
                <img 
                  src="https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?auto=format&fit=crop&w=1920&q=80" 
                  alt="Latar Perkemahan Malam Hari Realistis" 
                  className="w-full h-full object-cover object-center transform scale-105 animate-pulse duration-1000"
                  onError={(e) => {
                    e.target.onerror = null;
                    e.target.src = "https://images.unsplash.com/photo-1478131143081-80f7f84ca84d?auto=format&fit=crop&w=1920&q=80";
                  }}
                />
                <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/65 to-slate-900/60" />
                <div className="absolute inset-0 bg-emerald-950/30 mix-blend-overlay" />

                <div className="absolute bottom-12 left-1/2 -translate-x-1/2 flex justify-center gap-6 pointer-events-none opacity-80">
                  <span className="w-2 h-2 bg-amber-400 rounded-full animate-ember-1 filter blur-[0.5px] shadow-[0_0_8px_#f59e0b]"></span>
                  <span className="w-2.5 h-2.5 bg-orange-500 rounded-full animate-ember-2 filter blur-[0.5px] shadow-[0_0_10px_#f97316]"></span>
                  <span className="w-1.5 h-1.5 bg-yellow-300 rounded-full animate-ember-3 filter blur-[0.5px] shadow-[0_0_6px_#fef08a]"></span>
                </div>
              </div>

              <div className="bg-white/75 backdrop-blur-xl border border-white/50 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl relative z-20 space-y-6 my-auto">
                <div className="text-center space-y-3">
                  <div className="w-20 h-20 bg-emerald-50 rounded-3xl flex items-center justify-center mx-auto text-emerald-700 border border-emerald-200 p-2 shadow-md">
                    <img src={LOGO_URL} alt="Logo SMP YPU Bandung" className="w-full h-full object-contain" />
                  </div>
                  <div>
                    <span className="px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-900 text-[10px] font-black uppercase tracking-wider border border-emerald-300">
                      SMP YPU Bandung
                    </span>
                    <h1 className="text-xl sm:text-2xl font-black text-slate-900 mt-1">Portal PjBL Kokurikuler</h1>
                    <p className="text-xs text-slate-600 mt-0.5">Sistem Presensi, LKPD & Jurnal Sesi Perkemahan</p>
                  </div>
                </div>

                <div className="grid grid-cols-2 p-1 bg-emerald-100/60 rounded-2xl border border-emerald-200 text-xs font-bold">
                  <button
                    type="button"
                    onClick={() => {
                      setLoginRole('group');
                      setPasscodeError('');
                    }}
                    className={`py-2 rounded-xl transition-all flex items-center justify-center gap-1.5 ${
                      loginRole === 'group'
                        ? 'bg-emerald-800 text-white shadow-md'
                        : 'text-emerald-900 hover:text-emerald-950'
                    }`}
                  >
                    <Users className="w-4 h-4" /> Login Kelompok
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setLoginRole('admin');
                      setPasscodeError('');
                    }}
                    className={`py-2 rounded-xl transition-all flex items-center justify-center gap-1.5 ${
                      loginRole === 'admin'
                        ? 'bg-emerald-800 text-white shadow-md'
                        : 'text-emerald-900 hover:text-emerald-950'
                    }`}
                  >
                    <ShieldCheck className="w-4 h-4" /> Login Admin
                  </button>
                </div>

                <form onSubmit={handleLoginSubmit} className="space-y-4 text-left">
                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-emerald-900 mb-1">
                      Username {loginRole === 'group' ? 'Kelompok' : 'Administrator'}
                    </label>
                    <div className="relative">
                      <Users className="w-4 h-4 text-slate-400 absolute left-3 top-3" />
                      <input
                        type="text"
                        value={usernameInput}
                        onChange={(e) => setUsernameInput(e.target.value)}
                        placeholder={loginRole === 'group' ? 'Contoh: arunika_1' : 'Username admin...'}
                        className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs font-semibold bg-white"
                        required
                      />

                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-emerald-900 mb-1">
                      Password
                    </label>
                    <div className="relative">
                      <Lock className="w-4 h-4 text-slate-400 absolute left-3 top-3" />
                      <input
                        type="password"
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        placeholder="••••••••"
                        className="w-full pl-9 pr-4 py-2.5 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs font-mono bg-white"
                        required
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase tracking-wider text-emerald-900 mb-1">
                      Verifikasi Captcha Angka
                    </label>
                    
                    <div className="flex items-center gap-2 mb-2">
                      <div className="flex-1 bg-gradient-to-r from-emerald-900 via-teal-900 to-emerald-950 p-2.5 rounded-xl text-center select-none tracking-widest font-mono font-black text-xl text-lime-300 border border-emerald-700 shadow-inner flex items-center justify-center relative overflow-hidden">
                        <span className="transform -skew-x-12 inline-block line-through decoration-emerald-500/60 decoration-2">
                          {captchaCode}
                        </span>
                      </div>

                      <button
                        type="button"
                        onClick={generateCaptcha}
                        title="Acak Ulang Captcha"
                        className="p-2.5 rounded-xl bg-emerald-100 text-emerald-800 hover:bg-emerald-200 border border-emerald-300 transition-colors"
                      >
                        <RefreshCw className="w-4 h-4" />
                      </button>
                    </div>

                    <input
                      type="text"
                      pattern="[0-9]*"
                      inputMode="numeric"
                      value={captchaInput}
                      onChange={(e) => setCaptchaInput(e.target.value.replace(/[^0-9]/g, ''))}
                      placeholder="Masukkan 5 digit angka di atas..."
                      className="w-full px-3.5 py-2 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs font-mono bg-white"
                      required
                    />
                  </div>

                  {passcodeError && (
                    <div className="p-2.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium flex items-center gap-2">
                      <AlertCircle className="w-4 h-4 shrink-0" />
                      <span>{passcodeError}</span>

                    type="submit"
                    className="w-full py-3 bg-emerald-800 hover:bg-emerald-900 text-white rounded-xl font-bold shadow-lg shadow-emerald-800/20 transition-all flex items-center justify-center gap-2 text-xs"

                    <ShieldCheck className="w-4 h-4" />

                </form>

                        <p className="text-[11px] font-black text-amber-300 tracking-wide">PjBL KOKURIKULER</p>
                      </div>
                    </div>
                    <button 
                      onClick={() => setMobileMenuOpen(false)}
                      className="md:hidden text-slate-300 hover:text-white"

                      { id: 'presensi', label: 'Presensi', icon: UserCheck, badge: `${members.length} Siswa` },
                      { id: 'lkpd', label: 'Upload LKPD', icon: FileText, badge: `${lkpdList.length} Berkas` },
                      { id: 'jurnal', label: 'Jurnal Kegiatan', icon: BookOpen, badge: `${jurnalList.length} Catatan` },
                      { id: 'mapel', label: 'Mata Pelajaran Terintegrasi', icon: BookMarked, badge: '5 Mapel' },
                      { id: 'dimensi', label: 'Dimensi Profil Lulusan', icon: Award, badge: 'Matriks' },
                    ].map((item) => {
                      const Icon = item.icon;
                      const isActive = activeTab === item.id;
                      return (
                        <button
                          key={item.id}
                          onClick={() => {

                            <Icon className={`w-5 h-5 transition-transform group-hover:scale-110 ${isActive ? 'text-white' : 'opacity-80'}`} />
                            <span>{item.label}</span>

                          <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                            isActive ? activeTheme.activeNavBadge : 'bg-black/30 text-white/80 border border-white/10'
                          }`}>
                            {item.badge}
                          </span>
                        </button>
                      );

                      <p className="text-xs text-slate-600 hidden sm:block font-medium">
                        Portal PjBL Kokurikuler SMP YPU Bandung • Leadership & Character Building Camp
                      </p>
                    </div>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="hidden sm:flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-200 text-[10px] font-extrabold text-emerald-800">
                      <span className={`w-2 h-2 rounded-full ${cloudStatus === 'syncing' ? 'bg-amber-500 animate-ping' : 'bg-emerald-500'}`}></span>
                      <Cloud className="w-3.5 h-3.5 text-emerald-600" />
                      <span>{cloudStatus === 'syncing' ? 'Menyimpan...' : 'Tersambung ke Cloud'}</span>
                    </div>

                    <div className="hidden lg:flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold">
                      <Calendar className="w-3.5 h-3.5 text-slate-500" />
                      <span>{new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</span>
                    </div>
                    <div className={`px-3.5 py-1.5 rounded-full ${activeTheme.badgeBg} text-xs font-extrabold flex items-center gap-2 shadow-xs`}>
                      <img src={LOGO_URL} alt="Logo" className="w-4 h-4 object-contain" />
                      <span>{currentGroup.name}</span>
                    </div>
                  </div>
                </header>

                <div className="p-4 sm:p-8 flex-1 space-y-6">
                  {activeTab === 'home' && (
                    <HomeTab 
                      currentGroup={currentGroup}
                      activeTheme={activeTheme}
                      members={members}
                      setMembers={setMembers}
                      presensiList={presensiList}
                      lkpdList={lkpdList}
                      jurnalList={jurnalList}
                      saveDataToLocalStorage={saveDataToLocalStorage}
                      showToast={showToast}
                    />
                  )}

                  {activeTab === 'struktur' && (
                    <StrukturTab
                      activeTheme={activeTheme}
                      members={members}
                      setMembers={setMembers}
                      isStructureLocked={isStructureLocked}
                      setIsStructureLocked={setIsStructureLocked}
                      saveDataToLocalStorage={saveDataToLocalStorage}
                      showToast={showToast}
                    />
                  )}

                  {activeTab === 'presensi' && (
                    <PresensiTab 
                      activeTheme={activeTheme}
                      currentGroup={currentGroup}
                      members={members}
                      presensiList={presensiList}
                      setPresensiList={setPresensiList}
                      saveDataToLocalStorage={saveDataToLocalStorage}
                      showToast={showToast}
                    />
                  )}

                  {activeTab === 'lkpd' && (
                    <LKPDTab 
                      activeTheme={activeTheme}
                      currentGroup={currentGroup}
                      lkpdList={lkpdList}
                      setLkpdList={setLkpdList}
                      saveDataToLocalStorage={saveDataToLocalStorage}
                      showToast={showToast}
                    />
                  )}

                  {activeTab === 'jurnal' && (
                    <JurnalTab 
                      activeTheme={activeTheme}
                      currentGroup={currentGroup}
                      jurnalList={jurnalList}
                      setJurnalList={setJurnalList}
                      saveDataToLocalStorage={saveDataToLocalStorage}
                      showToast={showToast}
                    />
                  )}

                  {activeTab === 'mapel' && (
                    <MapelTerintegrasiTab activeTheme={activeTheme} />
                  )}

                  {activeTab === 'dimensi' && (
                    <DimensiTab activeTheme={activeTheme} />
                  )}
                </div>

                <footer className="mt-auto border-t border-slate-200/80 bg-white/60 px-6 py-4 text-center text-xs text-slate-600 flex flex-col sm:flex-row justify-between items-center gap-2">
                  <span className="flex items-center gap-1.5 font-semibold text-slate-700">
                    <Sparkles className="w-3.5 h-3.5 text-amber-500" />
                    Dashboard Project-Based Learning (PjBL) Kokurikuler SMP YPU Bandung
                  </span>
                  <span className="font-semibold text-slate-800">
                    Created and Designed by @ihsanmsyahid
                  </span>
                </footer>
              </main>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
